name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      # vendored 的 minter 源码至少要能编译：它不在 Go 的检查范围内，坏了只有构建镜像
      # 时才会炸（而那已经是发版后段，代价高）。
      - name: minter 源码语法检查
        run: python3 -m compileall -q deploy/minter/minter
      - run: go build ./...
      - run: go test ./... -count=1
