# aivideomaker2api 反代样例
#
# 三个要点：
#   1. proxy_read_timeout 必须大于闸门等待（queue.acquire_timeout，默认 600s）——
#      否则 Nginx 会在上游还没接单时先掐掉连接，而服务端仍在排队（那个任务照跑照扣）。
#   2. 成片下载是**流式**的：proxy_buffering off + 关掉 request buffering 才不会把
#      几百 MB 的片子先落到 Nginx 的临时目录里。
#   3. client_max_body_size 要覆盖"站点合法的最坏组合"（图 4×10MB + 视频 50MB + 音频
#      2×15MB = 120MB）+ 余量。

server {
    listen 443 ssl;
    http2 on;
    server_name avm2api.1task.cn;

    ssl_certificate     /etc/nginx/ssl/1task.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/1task.cn.key;

    client_max_body_size 128m;

    # 面板与 API 同端口：/panel 走浏览器，其余走上游 API。
    location / {
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # 建任务要等上游排队 + 转存，慢是正常的（受理分离之后 POST 会毫秒级返回，
        # 但 dry-run 与 /healthz?deep=1 仍会打上游）。
        proxy_connect_timeout 10s;
        proxy_send_timeout    660s;
        proxy_read_timeout    660s;
    }

    # 成片出口：流式转发，不缓冲、不落盘。
    location /v/ {
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range           $http_range;
        proxy_set_header If-Range        $http_if_range;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        add_header Accept-Ranges bytes;
    }

    # 面板只给内网/办公网访问时，把这段放开并删掉上面 location / 里的面板可达性。
    # location /panel/ {
    #     allow 10.0.0.0/8;
    #     allow 172.16.0.0/12;
    #     deny  all;
    #     proxy_pass http://127.0.0.1:8808;
    # }
}
